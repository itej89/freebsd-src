#!/bin/sh
#
# StarFive VisionFive 2 (JH7110) SD image.
#
# Differs from GENERICSD in two ways: it builds the VISIONFIVE2 kernel rather
# than GENERIC, and it installs this board's hardware-enablement packages into
# the image, so a freshly written card boots with display, GPU and video
# decode already working instead of needing a board to be logged into and
# configured by hand.

EMBEDDED_TARGET_ARCH="riscv64"
EMBEDDED_TARGET="riscv"
EMBEDDEDBUILD=1
FAT_SIZE="54m -b 8m"
FAT_TYPE="16"

# 6 GB, the same as GENERICSD: the packages below add well under a gigabyte
# and the image must still fit a nominal 8 GB card, which is ~7.4 GiB usable.
# growfs_enable expands the root filesystem to the real card on first boot.
IMAGE_SIZE="6144M"

KERNEL="VISIONFIVE2"
MD_ARGS="-x 63 -y 255"
PART_SCHEME="GPT"
EFIPART_SUFFIX=p3
ROOTFSPART_SUFFIX=p4
export BOARDNAME="VISIONFIVE2"

#
# Where the board's own packages come from.
#
# These are not on pkg.FreeBSD.org and cannot be: two of them wrap vendor
# firmware and a vendor DDK. They are built by the poudriere that also builds
# this image. Override VF2_PKG_REPO_DIR to build from a repository elsewhere.
#
: ${VF2_PKG_REPO_DIR:="/usr/local/poudriere/data/packages/vf2_15_1_riscv64-vf2ports/.latest"}

# visionfive2-config depends on graphics/pvrsrvkm-kmod, which depends on
# graphics/drm-vf2-kmod and misc/jh7110-firmware, so naming it brings the
# whole hardware-enablement set. mesa-dri is named separately because nothing
# in that chain requires it -- the modules work headless.
: ${VF2_PKG_LIST:="visionfive2-config mesa-dri"}

arm_create_partitions() {
	# Two partitions reserved ahead of EFI and ROOTFS, exactly as
	# GENERICSD does, for u-boot SPL and u-boot itself.
	#
	# This board does not boot from them -- it boots from SPI NOR flash,
	# and on a working board these two partitions are present but entirely
	# zero. They are reserved anyway because the JH7110 *can* be strapped
	# to boot from the SD card, and because leaving the layout identical
	# to GENERICSD means a card written with either image has the same
	# partition numbering.

	chroot ${CHROOTDIR} gpart add -t hifive-fsbl -l spl -a 512k -b 2m -s 2m ${mddev}
	chroot ${CHROOTDIR} gpart add -t hifive-bbl -l uboot -a 512k -b 4m -s 4m ${mddev}
}

arm_do_quirk() {
	local _abifile _pkgroot _conf _pkg _rc _f

	_pkgroot="${CHROOTDIR}/${DESTDIR}"
	_abifile="${_pkgroot}/usr/bin/uname"

	if [ ! -d "${VF2_PKG_REPO_DIR}/All" ]; then
		echo "ERROR: no package repository at ${VF2_PKG_REPO_DIR}" >&2
		echo "  This image exists to ship the VisionFive 2 hardware" >&2
		echo "  enablement packages. Building it without them would" >&2
		echo "  produce a card indistinguishable from stock GENERICSD:" >&2
		echo "  no display, no GPU, no video decoder. Build them first," >&2
		echo "  or set VF2_PKG_REPO_DIR to a repository that has them." >&2
		return 1
	fi

	if [ ! -f "${_abifile}" ]; then
		echo "ERROR: ${_abifile} missing; installworld did not run?" >&2
		return 1
	fi

	# pkg runs on the host, not inside ${CHROOTDIR}: the chroot is a freshly
	# installed world with no ports in it and therefore no pkg, while the
	# host -- the machine that built these packages -- has one. Package
	# scripts are riscv64 binaries and execute under the qemu-user image
	# activator (binmiscctl), the same mechanism poudriere already needs to
	# build them at all.
	#
	# ABI comes from the image's own uname rather than being written out
	# here, so it cannot drift from what was actually installed.
	#
	# Note the repository URL is a host path, NOT a path inside the image:
	# pkg resolves file:// URLs against the host filesystem even under -r.
	# Mounting the repository inside the image root and pointing at it there
	# looks right and silently fails to find the catalogue.
	_conf=$(mktemp -d) || return 1
	cat > "${_conf}/vf2.conf" <<-EOF
	vf2: {
	  url: "file://${VF2_PKG_REPO_DIR}",
	  enabled: yes
	}
	EOF

	set -- -r "${_pkgroot}" -o ABI_FILE="${_abifile}" -o REPOS_DIR="${_conf}"
	_pkg="env ASSUME_ALWAYS_YES=yes IGNORE_OSVERSION=yes pkg"

	# A fresh image root has no catalogue of its own, so the repository must
	# be read in before anything can be resolved from it. Without this every
	# install fails with "Repository vf2 cannot be opened".
	if ! ${_pkg} "$@" update -f; then
		echo "ERROR: could not read the repository catalogue" >&2
		rm -rf "${_conf}"
		return 1
	fi

	# Check every package resolves BEFORE installing any of them.
	#
	# poudriere writes a catalogue covering the set that was built, not
	# everything sitting in All/. This repository has held 183 package files
	# while its catalogue listed 5, because the previous bulk run named a
	# single port. A package that is present on disk but absent from the
	# catalogue is invisible to pkg, and installing "most of" the list would
	# yield an image that boots and is quietly missing its graphics stack.
	#
	# The fix is not to paper over it here: build the image's whole package
	# list in one poudriere bulk invocation, so that one coherent build
	# produces both the packages and the catalogue that describes them.
	for _f in ${VF2_PKG_LIST}; do
		if ! ${_pkg} "$@" rquery -r vf2 %n "${_f}" >/dev/null 2>&1; then
			echo "ERROR: ${_f} is not in the repository catalogue at" >&2
			echo "  ${VF2_PKG_REPO_DIR}" >&2
			echo "  It may still exist in All/ -- poudriere catalogues" >&2
			echo "  only the set that was built. Build the image's whole" >&2
			echo "  package list in ONE bulk run:" >&2
			echo "    poudriere bulk -j <jail> -p <tree> \\" >&2
			echo "      sysutils/visionfive2-config graphics/mesa-dri" >&2
			rm -rf "${_conf}"
			return 1
		fi
	done

	${_pkg} "$@" install -y ${VF2_PKG_LIST}
	_rc=$?

	${_pkg} "$@" clean -ay >/dev/null 2>&1
	rm -rf "${_conf}"

	if [ ${_rc} -ne 0 ]; then
		echo "ERROR: installing ${VF2_PKG_LIST} failed (${_rc})" >&2
		return 1
	fi

	# Verify files rather than trust the exit status: a port with no
	# PLIST_FILES stages nothing, packages "successfully" and installs
	# "successfully" while delivering an empty package. graphics/drm-vf2-kmod
	# did exactly that, and because poudriere bulk does not run check-plist
	# nothing caught it until a dependent port broke on the board.
	for _f in /boot/modules/pvrsrvkm.ko /boot/modules/drm.ko \
	          /boot/modules/verisilicon.ko /boot/modules/dmabuf.ko \
	          /boot/modules/ttm.ko /usr/local/sbin/vf2-setmode \
	          /usr/local/etc/rc.d/vf2_display; do
		if [ ! -f "${_pkgroot}${_f}" ]; then
			echo "ERROR: ${_f} missing after install" >&2
			return 1
		fi
	done

	# Enable the display service through rc.conf.d, not rc.conf:
	# arm_install_base() writes /etc/rc.conf with '>' *after* this function
	# returns, so anything put there would be silently discarded.
	mkdir -p "${_pkgroot}/etc/rc.conf.d"
	cat > "${_pkgroot}/etc/rc.conf.d/vf2_display" <<-EOF
	# Loads the display, GPU and video-decoder modules and programs a mode.
	# Installed by release/riscv/VISIONFIVE2.conf.
	vf2_display_enable="YES"
	EOF

	# The port ships loader tunables as a .sample so it never overwrites an
	# administrator's file. In an image there is no administrator yet and no
	# file to overwrite, so activate it.
	if [ -f "${_pkgroot}/boot/loader.conf.d/visionfive2.conf.sample" ] && \
	   [ ! -f "${_pkgroot}/boot/loader.conf.d/visionfive2.conf" ]; then
		cp -p "${_pkgroot}/boot/loader.conf.d/visionfive2.conf.sample" \
		      "${_pkgroot}/boot/loader.conf.d/visionfive2.conf"
	fi

	return 0
}
